[project]
name = "quantum-agent"
version = "0.1.0"
description = "MCP plugin for quantum agentic systems: read IBM Quantum backends, build and classify circuits, simulate before spending QPU time."
readme = "README.md"
license = "MIT"
authors = [{ name = "Deadsg" }]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2",
  "qiskit>=2.0",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime>=0.40",
]

[project.scripts]
quantum-agent-mcp = "quantum_agent.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
